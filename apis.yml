name: Celequest
description: >-
  Celequest was a business intelligence software company that built an appliance-based platform for
  real-time operational BI — streaming dashboards and continuous analytics over live transactional data
  rather than batch data-warehouse reporting. The company was acquired by Cognos in 2007, and its
  technology was folded into the Cognos Now! operational BI appliance; Cognos itself was acquired by IBM
  in 2008. Celequest no longer operates as an independent company and publishes no developer surface. As
  of the 2026-07-20 enrichment probe, celequest.com and www.celequest.com resolve to IBM redirect
  infrastructure (redirect.www.ibm.com) and issue a blanket HTTP 301 to the IBM Cognos Now! product page
  for every path, including /.well-known/* and /llms.txt. There is no portal, no documentation, no API,
  and no artifacts to harvest. This record is retained as a historical/acquired-company entry in the API
  Evangelist network.
